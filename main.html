<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH SMP - Item Selling Prices</title>
    <!-- Google Fonts for Minecraft style look -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --border-color: #2e2e38;
            --accent-green: #55ff55;
            --accent-gold: #ffaa00;
            --text-main: #f0f0f5;
            --text-muted: #9999aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            color: var(--accent-gold);
            text-shadow: 3px 3px #000;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3rem;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #searchInput:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .stats {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 1200px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-gold);
        }

        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
            padding-right: 1rem;
        }

        .item-price {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: var(--accent-green);
            white-space: nowrap;
            background: rgba(85, 255, 85, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>SH SMP Shop Prices</h1>
        <p class="subtitle">Official item selling price directory for the server</p>
    </header>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search items (e.g. Diamond, Netherite, Apple)..." autofocus>
    </div>

    <div class="stats" id="statsCount">Loading items...</div>

    <div class="grid-container" id="itemGrid">
        <!-- Items injected dynamically via JavaScript -->
    </div>

        SH SMP prices are issued by HardMCco

            const filtered = itemsArray.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.rawKey.toLowerCase().includes(query)
            );

            statsCount.textContent = `Showing ${filtered.length} of ${itemsArray.length} items`;

            if (filtered.length === 0) {
                itemGrid.innerHTML = `<div class="no-results">No items found matching "${filter}"</div>`;
